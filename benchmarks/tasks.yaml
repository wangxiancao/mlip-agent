  - id: B17
    description: 恢复类：内联坐标直接做 freq 被校验拒绝 → 诊断后改走 opt→freq 正确链（ANI-2x；复用 B3 pin，见 §3.2）
    tier: recovery
    min_jobs: 2
    prompt: >-
      直接对这个水分子做振动频率分析（用 ANI-2x，电荷 0，多重度 1）：
      O 0.00000000 0.00000000 0.00000000 / H 0.96000000 0.00000000 0.00000000 /
      H -0.24000000 0.93000000 0.00000000
    expect: {backend: maple, job_types: [opt, freq], model: ani2x}
    assertions:
      - {type: final_status, value: completed}
      # canned 剧本首试 write_maple_inp(freq + 内联坐标) 必被 jobspec 校验拒绝（D7-3）；
      # live 下 agent 已知 freq 需 xyz_file 可直接走正确链，不强制失败首试
      - {type: tool_call_failed, name: write_maple_inp, only_mode: canned}
      - {type: job_count, value: 2}
      - {type: job_type, job: 0, value: opt}
      - {type: job_type, job: 1, value: freq}
      - {type: converged, job: 0, value: true}
      # 复用 B3 pin（频率容差 ±20 cm⁻¹ 对起始点不敏感，D5-3）
      - {type: frequencies_real, job: 1, values: [1966.21, 4199.58, 4607.14], tol: 20.0, kind: numeric, ref: references/B3.json}
      - {type: n_imaginary, job: 1, value: 0, kind: numeric, ref: references/B3.json}

  - id: B18
    description: 恢复类：20 步 NVE 未带 log_every 无逐步能量 → 诊断后 log_every=1 重跑（ANI-2x；复用 B7 口径，见 §3.2）
    tier: recovery
    min_jobs: 1
    prompt: "对水分子跑 20 步 NVE 分子动力学并分析总能量漂移，步长 0.5 fs（用 ANI-2x，电荷 0，多重度 1）"
    expect: {backend: maple, job_types: [md], model: ani2x}
    assertions:
      - {type: final_status, value: completed}
      - {type: tool_called, name: run_maple}
      # canned 剧本首跑不带 log_every（MAPLE 默认 100，无逐步能量行，D5-1）后重跑；
      # live 下 agent 已知短 MD 需 log_every=1 可一次做对（min_jobs=1 计入一次成功率）
      - {type: job_count, value: 2, only_mode: canned}
      - {type: md_steps_max, job: 0, value: 19, only_mode: canned}
      - {type: job_type, job: -1, value: md}
      - {type: md_steps, job: -1, value: 20}
      - {type: energy_drift_max, job: -1, value: 1.0e-3, kind: numeric}

