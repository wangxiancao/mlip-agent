# 验收任务集（PLAN §3.1 v1 任务集 + §3.2 v2 重构）。
# 每条：id / description / tier / min_jobs / prompt（自然语言）/ expect / assertions。
# 断言由 judge.py 对 runner 产出的 run_record.json 求值；kind: numeric 计入
# 「数值正确率」，kind: execution 计入「执行成功率」（缺省 execution）。
# 数值 pin 来源：benchmarks/references/Bx.json（M0 金标准，2026-10-02 同机复现）。
# v2 字段说明（§3.2）：
#   tier: guided（B1–B16、B20、B23–B26）| recovery（B17/B18，首试必失败测诊断修复）| unguided（B19）
#   min_jobs: 期望最小作业数（效率指标基准，informational 不影响 pass/fail）
#   断言级 only_mode: canned —— 只在 canned 模式求值（live 下恢复路径由 agent 自主决策，
#     不强制失败首试）；job 索引支持负数（-1 = 最后一个作业）
# 通用字段说明：
#   auto_answer: 挂起在 ask_user_question 时 runner 自动注入的用户答复
#   job: 断言作用的作业序号（0-based，按 job_id 排序）

tasks:
  - id: B1
    description: sp 单点能（ANI-2x，22 原子内联坐标）
    tier: guided
    min_jobs: 1
    prompt: >-
      用 ANI-2x 计算这个分子的单点能（电荷 0，自旋多重度 1）：
      C -0.778126 -1.067561 0.321059 / C 1.302553 0.052120 -0.028299 /
      C -0.971993 1.456249 0.823657 / C 1.981229 -0.418433 1.250175 /
      C 2.264033 0.435168 -1.133107 / N 0.291164 -0.876821 -0.500399 /
      N -2.019163 -1.372006 -0.233112 / O -1.664734 1.630223 -0.401837 /
      H -2.258632 0.870139 -0.475899 / H 0.027849 -0.678312 -1.458495 /
      H -0.609759 -1.367856 1.341178 / H 0.681264 0.918300 0.286941 /
      H -2.573263 -2.057361 0.257412 / H -2.052428 -1.504542 -1.233823 /
      H -0.368993 2.351392 0.991747 / H -1.639609 1.294215 1.674653 /
      H 2.764449 0.291462 1.522846 / H 1.725114 0.730695 -2.037794 /
      H 2.435593 -1.406098 1.134215 / H 1.273005 -0.447224 2.080579 /
      H 2.850345 1.298697 -0.814322 / H 2.960009 -0.368806 -1.388910
    expect: {backend: maple, job_types: [sp], model: ani2x}
    assertions:
      - {type: final_status, value: completed}
      - {type: event_present, event: TOOL_CALL_START}
      - {type: tool_called, name: run_maple}
      - {type: suspended_with_tool, value: run_maple}
      - {type: job_count, value: 1}
      - {type: job_type, job: 0, value: sp}
      - {type: artifact_present, job: 0, name: input.out}
      - {type: energy_hartree, job: 0, value: -383.4722385376, tol: 1.0e-6, kind: numeric, ref: references/B1.json}
      - {type: output_contains, text: "eV"}

  - id: B2
    description: H2O 几何优化（ANI-2x）
    tier: guided
    min_jobs: 1
    prompt: "优化水分子的几何结构（用 ANI-2x，电荷 0，多重度 1）"
    expect: {backend: maple, job_types: [opt], model: ani2x}
    assertions:
      - {type: final_status, value: completed}
      - {type: tool_called, name: run_maple}
      - {type: job_count, value: 1}
      - {type: job_type, job: 0, value: opt}
      - {type: converged, job: 0, value: true}
      - {type: energy_hartree, job: 0, value: -76.388301, tol: 1.0e-6, kind: numeric, ref: references/B2.json}
      - type: geometry_h2o
        job: 0
        oh_angstrom: [0.963788, 0.963864]
        oh_tol: 0.005
        angle_deg: 104.1618
        angle_tol: 1.0
        kind: numeric
        ref: references/B2.json

  - id: B3
    description: H2O 优化 + 频率（ANI-2x；pin MAPLE freq(mw) 实际输出，见 TICKET-0001 / D0-5）
    tier: guided
    min_jobs: 2
    prompt: "优化水分子并计算振动频率（用 ANI-2x，电荷 0，多重度 1）"
    expect: {backend: maple, job_types: [opt, freq], model: ani2x}
    assertions:
      - {type: final_status, value: completed}
      - {type: job_count, value: 2}
      - {type: job_type, job: 0, value: opt}
      - {type: job_type, job: 1, value: freq}
      - {type: converged, job: 0, value: true}
      # 只比实频（ν > 5.0 cm⁻¹，与 MAPLE 汇总口径一致）；含 6 个近零投影模
      - {type: frequencies_real, job: 1, values: [1966.21, 4199.58, 4607.14], tol: 20.0, kind: numeric, ref: references/B3.json}
      - {type: n_imaginary, job: 1, value: 0, kind: numeric, ref: references/B3.json}

