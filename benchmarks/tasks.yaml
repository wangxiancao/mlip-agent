    assertions:
      - {type: final_status, value: completed}
      - {type: job_count, value: 1}
      - {type: job_type, job: 0, value: md}
      - {type: md_steps, job: 0, value: 20}
      # 总能量漂移（相对首步）< 1e-3 Ha
      - {type: energy_drift_max, job: 0, value: 1.0e-3, kind: numeric}

