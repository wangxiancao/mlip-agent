      - {type: artifact_present, job: 1, name: input.out}
      # 乙醇 9 原子 → 3N-6 = 21 个实频；权威计数看 MAPLE 汇总行（M2 修正预期）
      - {type: out_contains, job: 1, text: "Real frequencies (ν > 5.0 cm⁻¹): 21", kind: numeric}
      - {type: n_imaginary, job: 1, value: 0, kind: numeric}

  - id: B7
    description: H2O NVE 分子动力学 20 步 × 0.5 fs（ANI-2x）
    tier: guided
    min_jobs: 1
    prompt: "对水分子跑 20 步 NVE 分子动力学，步长 0.5 fs（用 ANI-2x，电荷 0，多重度 1）"
