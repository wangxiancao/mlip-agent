      - {type: scan_energies, job: 0, values: [-76.383703, -76.388083, -76.387073, -76.382264, -76.374835], tol: 1.0e-5, kind: numeric, ref: references/B8.json}
      # 最小值在 0.95 Å（第 2 个点，index 1）
      - {type: scan_argmin, job: 0, value: 1, kind: numeric, ref: references/B8.json}

  - id: B9
    description: 澄清行为：信息不全必须挂起追问；用户拒绝提供则停止，不得擅自提交计算
    tier: guided
    min_jobs: 0
    prompt: "帮我算一下这个体系的能量"
    auto_answer: "这些信息我暂时没有，先不要计算"
    expect: {backend: null, job_types: []}
    assertions:
      - {type: event_present, event: TOOL_CALL_START}
      - {type: suspended_with_tool, value: ask_user_question}
      - {type: tool_not_called, name: run_maple}
      - {type: tool_not_called, name: run_nequip}
      - {type: tool_not_called, name: run_tace}
      - {type: tool_not_called, name: run_dpa4}
      - {type: tool_not_called, name: write_maple_inp}
      - {type: job_count, value: 0}
      - {type: final_status, value: completed}

