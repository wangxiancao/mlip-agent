# Benchmark v3 反应能垒套件（PLAN §3.3）：GMTKN55 BH76 六反应 × 三档知识梯度。
# tier: baseline（基本信息）/ decision（+ladder.md 注入）/ replication（完整工作流）。
# 判定参考量由 suite_judge 按 ref.json 做反应感知求值（coverage/MAE/attempts/cost），
# 此处的 assertions 只做最低执行检查；数据集出处见各 references/R*/ref.json。

tasks:

  - id: R1-base
    description: "[baseline] HCN→HNC 异构化：opt/freq/scan/ts/ts_freq 六段链 + 能垒汇总"
    tier: baseline
    reaction: R1
    min_jobs: 7
    timeout_s: 5400
    prompt: >-
      研究反应 HCN→HNC 异构化（全部用 AIMNet2 模型）。
      各物种结构文件：/root/soft/ml_potential/mlip_agent/benchmarks/reaction/references/R1/r1.xyz（电荷 0，多重度 1）；/root/soft/ml_potential/mlip_agent/benchmarks/reaction/references/R1/p1.xyz（电荷 0，多重度 1）。
      过渡态初猜：/root/soft/ml_potential/mlip_agent/benchmarks/reaction/references/R1/ts.xyz（电荷 0，多重度 1）。
      目标：优化各分子并做振动频率分析，沿反应坐标做键长扫描，搜索过渡态并验证，最后给出正向能垒、反向能垒与反应能（单位 kcal/mol）。
    expect: {backend: maple, job_types: [opt, freq, scan, ts], model: aimnet2}
    assertions:
      - {type: final_status, value: completed}
      - {type: tool_called, name: run_maple}

  - id: R1-dec
    description: "[decision] HCN→HNC 异构化：opt/freq/scan/ts/ts_freq 六段链 + 能垒汇总"
    tier: decision
    reaction: R1
    min_jobs: 7
    timeout_s: 5400
    prompt: >-
      研究反应 HCN→HNC 异构化（全部用 AIMNet2 模型）。
      各物种结构文件：/root/soft/ml_potential/mlip_agent/benchmarks/reaction/references/R1/r1.xyz（电荷 0，多重度 1）；/root/soft/ml_potential/mlip_agent/benchmarks/reaction/references/R1/p1.xyz（电荷 0，多重度 1）。
      过渡态初猜：/root/soft/ml_potential/mlip_agent/benchmarks/reaction/references/R1/ts.xyz（电荷 0，多重度 1）。
      目标：优化各分子并做振动频率分析，沿反应坐标做键长扫描，搜索过渡态并验证，最后给出正向能垒、反向能垒与反应能（单位 kcal/mol）。
    expect: {backend: maple, job_types: [opt, freq, scan, ts], model: aimnet2}
    assertions:
      - {type: final_status, value: completed}
      - {type: tool_called, name: run_maple}

  - id: R1-repl
    description: "[replication] HCN→HNC 异构化：opt/freq/scan/ts/ts_freq 六段链 + 能垒汇总"
    tier: replication
    reaction: R1
    min_jobs: 7
    timeout_s: 5400
    prompt: >-
      研究反应 HCN→HNC 异构化（全部用 AIMNet2 模型），按以下工作流执行：
      1. 读入各物种结构（/root/soft/ml_potential/mlip_agent/benchmarks/reaction/references/R1/r1.xyz（电荷 0，多重度 1）；/root/soft/ml_potential/mlip_agent/benchmarks/reaction/references/R1/p1.xyz（电荷 0，多重度 1）），分子物种依次做几何优化（opt）。所有物种都是分子，均需优化与频率。
      2. 对每个优化收敛的分子做频率分析（job_type=freq）：structure 必须用这个 opt 作业返回摘要里 parsed.final_xyz 的坐标经 build_structure(source_type="inline_coords") 落盘后的 xyz 路径；极小点应 0 虚频，若出现虚频则提高 opt 收敛等级重优化后重算。
      3. 刚性扫描：取 r1.xyz 优化后的结构，先把 H−C 键（原子 1−3）键长直接改为 1.0659 Å，再扫描 6 个点（delta=0.1100，n_steps=5）。
      4. 用 /root/soft/ml_potential/mlip_agent/benchmarks/reaction/references/R1/ts.xyz 作初猜做过渡态搜索（job_type=ts，method=prfo，电荷 0，多重度 1）。
      5. 对 TS 结构做频率分析（同样用 xyz_file），应恰有 1 个虚频。
      6. 汇总：E(反应物)、E(产物) 分别为各自物种优化后能量之和（Hartree）；正向能垒 = E(TS) − E(反应物)，反向能垒 = E(TS) − E(产物)，反应能 = E(产物) − E(反应物)，乘以 627.5095 换算为 kcal/mol 报告。
    expect: {backend: maple, job_types: [opt, freq, scan, ts], model: aimnet2}
    assertions:
      - {type: final_status, value: completed}
      - {type: tool_called, name: run_maple}

