    prompt: >-
      研究反应 CH3 + C2H4 → C3H7（自由基加成）（全部用 AIMNet2 模型），按以下工作流执行：
      1. 读入各物种结构（/root/soft/ml_potential/mlip_agent/benchmarks/reaction/references/R5/r1.xyz（电荷 0，多重度 2）；/root/soft/ml_potential/mlip_agent/benchmarks/reaction/references/R5/r2.xyz（电荷 0，多重度 1）；/root/soft/ml_potential/mlip_agent/benchmarks/reaction/references/R5/p1.xyz（电荷 0，多重度 2）），分子物种依次做几何优化（opt）。所有物种都是分子，均需优化与频率。
      2. 对每个优化收敛的分子做频率分析（job_type=freq）：structure 必须用这个 opt 作业返回摘要里 parsed.final_xyz 的坐标经 build_structure(source_type="inline_coords") 落盘后的 xyz 路径；极小点应 0 虚频，若出现虚频则提高 opt 收敛等级重优化后重算。
